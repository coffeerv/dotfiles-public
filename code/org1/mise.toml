[env]
# org1 has its own GitHub account: gh state lives inside the org directory.
GH_CONFIG_DIR = "{{config_root}}/.gh"
AWS_PROFILE   = "org1"

# Secrets via fnox, read from the local age cache (no prompts, no network).
BITBUCKET_TOKEN  = "{{ exec(command=env.HOME ~ '/.local/share/mise/installs/fnox/latest/fnox get BITBUCKET_TOKEN') }}"
JIRA_TOKEN       = "{{ exec(command=env.HOME ~ '/.local/share/mise/installs/fnox/latest/fnox get JIRA_TOKEN') }}"

# DD_API_KEY/DD_APP_KEY are the names the Datadog CLI expects.
DD_SITE          = "datadoghq.com"
DD_API_KEY       = "{{ exec(command=env.HOME ~ '/.local/share/mise/installs/fnox/latest/fnox get DD_API_KEY') }}"
DD_APP_KEY       = "{{ exec(command=env.HOME ~ '/.local/share/mise/installs/fnox/latest/fnox get DD_APP_KEY') }}"

# Claude Code uses the org's subscription inside ~/code/org1 and your own /login elsewhere.
# Only applies when `claude` starts from a shell with mise active. Check with /status.
CLAUDE_CODE_OAUTH_TOKEN = "{{ exec(command=env.HOME ~ '/.local/share/mise/installs/fnox/latest/fnox get CLAUDE_CODE_OAUTH_TOKEN') }}"

# Short-lived OAuth access token (~1 h), refreshed by the script only when it expires.
OAUTH_TOKEN_URL    = "https://auth.org1.example/oauth/token"
OAUTH_ACCESS_TOKEN = "{{ exec(command=config_root ~ '/bin/oauth-access-token') }}"

# Exported under an explicit name, NOT as PGPASSWORD, so it never reaches your local dev Postgres by accident.
ORG1_RO_DB_PASSWORD = "{{ exec(command=env.HOME ~ '/.local/share/mise/installs/fnox/latest/fnox get RO_DB_PASSWORD') }}"

[tools]
# Per-org tool versions, pinned.
ruby = "3.3"
