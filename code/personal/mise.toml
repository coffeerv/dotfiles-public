# Everything under ~/code/personal gets these. Leaving the directory unsets them.
[env]
# gh account for this identity (log in once with: GH_CONFIG_DIR=... gh auth login).
GH_CONFIG_DIR     = "{{env.HOME}}/.config/gh-personal"
# The real fnox binary, not the mise shim: the shim would re-evaluate this file and recurse.
ANTHROPIC_API_KEY = "{{ exec(command=env.HOME ~ '/.local/share/mise/installs/fnox/latest/fnox get ANTHROPIC_API_KEY') }}"
